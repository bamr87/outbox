name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python3 -m pip install -e .
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Suite smoke
        run: python3 -m outbox.cli suite --tasks tasks --out "$RUNNER_TEMP"
