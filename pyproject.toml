[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outbox"
version = "0.1.0"
description = "Competitive async outbox harness for three Grok-class agents."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Amr", email = "bamr87@users.noreply.github.com" }]
license = { text = "MIT" }

[project.scripts]
outbox = "outbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
